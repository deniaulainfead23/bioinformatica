<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#fff5f7"/><stop offset="1" stop-color="#ebf8ff"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#b)"/><text x="55" y="65" fill="#702459" font-family="Arial" font-size="30" font-weight="bold">Pré-processar também faz parte do dia a dia</text><text x="55" y="98" fill="#805ad5" font-family="Arial" font-size="18">Antes de concluir, conferimos, organizamos e questionamos os dados.</text><g font-family="Arial"><g transform="translate(65 155)"><rect width="315" height="245" rx="24" fill="white"/><text x="158" y="68" text-anchor="middle" font-size="60">🛒</text><text x="158" y="120" text-anchor="middle" fill="#702459" font-size="22" font-weight="bold">Lista de compras</text><text x="25" y="165" fill="#4a5568" font-size="17">Conferir itens repetidos,</text><text x="25" y="193" fill="#4a5568" font-size="17">unidades e faltas.</text></g><g transform="translate(442 155)"><rect width="315" height="245" rx="24" fill="white"/><text x="158" y="68" text-anchor="middle" font-size="60">🧪</text><text x="158" y="120" text-anchor="middle" fill="#702459" font-size="22" font-weight="bold">Rotina de laboratório</text><text x="25" y="165" fill="#4a5568" font-size="17">Conferir identificação,</text><text x="25" y="193" fill="#4a5568" font-size="17">unidade, faixa e origem.</text></g><g transform="translate(819 155)"><rect width="315" height="245" rx="24" fill="white"/><text x="158" y="68" text-anchor="middle" font-size="60">🤖</text><text x="158" y="120" text-anchor="middle" fill="#702459" font-size="22" font-weight="bold">Inteligência artificial</text><text x="25" y="165" fill="#4a5568" font-size="17">Um modelo aprende com</text><text x="25" y="193" fill="#4a5568" font-size="17">os dados que recebe.</text></g></g><text x="600" y="465" text-anchor="middle" fill="#702459" font-family="Arial" font-size="21" font-weight="bold">Dados organizados ajudam a fazer perguntas melhores.</text></svg>

