<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#071827"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#fff">O que é Bioinformática?</text><circle cx="400" cy="350" r="180" fill="#16b9e8" fill-opacity=".55"/><circle cx="600" cy="350" r="180" fill="#45d483" fill-opacity=".55"/><circle cx="800" cy="350" r="180" fill="#9d7bea" fill-opacity=".55"/><text x="330" y="305" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Computação</text><text x="310" y="345" font-family="Arial" font-size="20" fill="#fff">algoritmos</text><text x="310" y="375" font-family="Arial" font-size="20" fill="#fff">programação</text><text x="310" y="405" font-family="Arial" font-size="20" fill="#fff">bancos de dados</text><text x="555" y="270" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Biologia</text><text x="545" y="310" font-family="Arial" font-size="20" fill="#fff">DNA</text><text x="535" y="340" font-family="Arial" font-size="20" fill="#fff">genes</text><text x="520" y="370" font-family="Arial" font-size="20" fill="#fff">proteínas</text><text x="745" y="305" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Estatística</text><text x="735" y="345" font-family="Arial" font-size="20" fill="#fff">medidas</text><text x="725" y="375" font-family="Arial" font-size="20" fill="#fff">comparações</text><text x="720" y="405" font-family="Arial" font-size="20" fill="#fff">inferências</text><rect x="410" y="315" width="380" height="105" rx="24" fill="#fff"/><text x="600" y="362" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#071827">BIOINFORMÁTICA</text><text x="600" y="398" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">armazenar • organizar • analisar • interpretar</text><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="24" fill="#d8f9e5">A vida produz dados. A Computação ajuda a transformá-los em conhecimento.</text></svg>