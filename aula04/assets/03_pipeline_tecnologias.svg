<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><rect width="1400" height="620" fill="#071827"/><text x="700" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">Pipeline da Bioinformática</text><text x="700" y="98" text-anchor="middle" font-family="Arial" font-size="20" fill="#b9d6e9">Do dado bruto até a interpretação</text><g font-family="Arial"><rect x="45" y="210" width="165" height="110" rx="20" fill="#dff8e8"/><text x="128" y="255" text-anchor="middle" font-size="23" font-weight="700" fill="#14532d">Coleta</text><text x="128" y="287" text-anchor="middle" font-size="17" fill="#14532d">amostra / dado</text><rect x="250" y="210" width="175" height="110" rx="20" fill="#dff5ff"/><text x="338" y="255" text-anchor="middle" font-size="23" font-weight="700" fill="#075985">Geração</text><text x="338" y="287" text-anchor="middle" font-size="17" fill="#075985">sequenciamento</text><rect x="465" y="210" width="190" height="110" rx="20" fill="#fff4d6"/><text x="560" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f">Pré-processamento</text><text x="560" y="285" text-anchor="middle" font-size="17" fill="#78350f">qualidade • limpeza</text><rect x="695" y="210" width="180" height="110" rx="20" fill="#eee8ff"/><text x="785" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#5b21b6">Banco de dados</text><text x="785" y="285" text-anchor="middle" font-size="17" fill="#5b21b6">armazenar • consultar</text><rect x="915" y="210" width="180" height="110" rx="20" fill="#ffe7ec"/><text x="1005" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#881337">Algoritmos</text><text x="1005" y="285" text-anchor="middle" font-size="17" fill="#881337">BLAST • ML • análise</text><rect x="1135" y="210" width="220" height="110" rx="20" fill="#dbeafe"/><text x="1245" y="250" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Interpretação</text><text x="1245" y="285" text-anchor="middle" font-size="17" fill="#1e3a8a">gráficos • significado</text></g><g stroke="#7ca0b8" stroke-width="5"><line x1="210" y1="265" x2="250" y2="265"/><line x1="425" y1="265" x2="465" y2="265"/><line x1="655" y1="265" x2="695" y2="265"/><line x1="875" y1="265" x2="915" y2="265"/><line x1="1095" y1="265" x2="1135" y2="265"/></g><text x="700" y="410" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">Tecnologias que podem aparecer</text><text x="700" y="465" text-anchor="middle" font-family="Arial" font-size="23" fill="#5de0ff">Python   •   R   •   Linux   •   SQL   •   NCBI/BLAST   •   UniProt   •   PDB   •   Nuvem</text><text x="700" y="535" text-anchor="middle" font-family="Arial" font-size="21" fill="#d8f9e5">Bioinformática é um fluxo: cada etapa prepara o dado para a próxima decisão.</text></svg>